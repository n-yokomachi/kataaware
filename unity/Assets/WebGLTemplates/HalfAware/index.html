<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HALF AWARE</title>
    <link rel="icon" href="data:,">
    <!--
      HALF AWARE の WebGL テンプレート（PlayerSettings の WebGL Template で PROJECT:HalfAware を選ぶ）。
      - キャンバスは 16:9 のまま、窓に収まる一番大きい 48×27 の倍数の大きさにする。余りは黒い帯。
        3D は画面の 1/3 で描いて最近傍で拡げるので、縦横が 3 で割り切れると PS1 の画素がいつも 3×3 に揃う
      - devicePixelRatio を 1 に決める。高 DPI の画面でも描く大きさはキャンバスの CSS の大きさのままで、粗さが細かくならない。
        ブラウザがそれを画面の画素へ拡げるときも、image-rendering: pixelated で最近傍にする
      - autoSyncPersistentDataPath を点ける。PlayerPrefs.Save の後に IndexedDB へ書くのを Unity に任せる
        （JS_FileSystem_Sync は非推奨で、点けないとセーブのたびに warn が出る）
      - 読み込みの間は暗い地に細いバーだけを出す。Unity のロゴは出さない
    -->
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #unity-canvas { display: block; background: #000; outline: none; image-rendering: pixelated; }
      #loading { position: fixed; left: 50%; top: 50%; width: 160px; height: 2px; margin: -1px 0 0 -80px; background: #16161a; }
      #loading-fill { width: 0; height: 100%; background: #6e6e78; }
      #banner { position: fixed; left: 0; right: 0; bottom: 0; font: 12px/1.5 monospace; color: #c8c8d0; text-align: center; pointer-events: none; }
      #banner div { padding: 6px 12px; background: rgba(0, 0, 0, 0.8); }
      #banner div.error { color: #ff8a8a; pointer-events: auto; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="unity-canvas" width="960" height="540" tabindex="-1"></canvas>
    </div>
    <div id="loading"><div id="loading-fill"></div></div>
    <div id="banner"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#loading-fill");
      var banner = document.querySelector("#banner");

      // 窓に収まる一番大きい 48×27 の倍数へ合わせる
      function fit() {
        var k = Math.max(1, Math.floor(Math.min(window.innerWidth / 48, window.innerHeight / 27)));
        canvas.style.width = (48 * k) + "px";
        canvas.style.height = (27 * k) + "px";
      }
      window.addEventListener("resize", fit);
      fit();

      // Unity からの知らせ。warning は 5 秒で消し、error は残す
      function showBanner(msg, type) {
        var div = document.createElement("div");
        div.textContent = msg;
        if (type == "error") div.className = "error";
        banner.appendChild(div);
        if (type != "error") setTimeout(function () { banner.removeChild(div); }, 5000);
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showBanner,
        devicePixelRatio: 1,
        autoSyncPersistentDataPath: true,
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = (100 * progress) + "%";
        }).then(function () {
          loading.style.display = "none";
        }).catch(function (message) {
          loading.style.display = "none";
          showBanner(String(message), "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
